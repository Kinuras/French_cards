<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Français Quotidien - 100 Cartes Visuelles (A1-A2)</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #22c55e;
            --danger: #ef4444;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: flex-start;
        }

        header {
            background-color: var(--card-bg);
            width: 100%;
            padding: 1.5rem 0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            text-align: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            margin: 0;
            font-size: 1.75rem;
            color: var(--primary);
        }

        p.subtitle {
            margin: 0.5rem 0 0 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            max-width: 650px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
            padding-bottom: 3rem;
        }

        /* Category Filter Buttons */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        .filter-btn {
            background-color: #e2e8f0;
            color: var(--text-main);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--primary);
            color: white;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Flashcard Styles */
        .card-container {
            perspective: 1000px;
            width: 100%;
            height: 360px;
            cursor: pointer;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: var(--shadow);
            border-radius: 1rem;
            background-color: var(--card-bg);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 1rem;
            padding: 2rem;
            box-sizing: border-box;
        }

        .card-front {
            background-color: var(--card-bg);
        }

        .card-back {
            background-color: #f1f5f9;
            transform: rotateY(180deg);
        }

        .card-image {
            width: 170px;
            height: 170px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--bg-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.25rem;
        }

        .french-word {
            font-size: 2.25rem;
            font-weight: bold;
            color: var(--primary);
            margin: 0;
        }

        .hint {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 1rem;
            width: 100%;
            justify-content: center;
        }

        button {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-audio {
            background-color: #e0e7ff;
            color: var(--primary);
            margin-top: 1rem;
        }

        .btn-audio:hover {
            background-color: #c7d2fe;
        }

        .btn-know {
            background-color: var(--success);
            color: white;
            flex: 1;
        }

        .btn-know:hover {
            background-color: #16a34a;
        }

        .btn-retry {
            background-color: var(--danger);
            color: white;
            flex: 1;
        }

        .btn-retry:hover {
            background-color: #dc2626;
        }

        .completion-screen {
            text-align: center;
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: var(--shadow);
            width: 100%;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>🇫🇷 100 Objets, Sport & Vie Quotidienne</h1>
        <p class="subtitle">Apprenez le français adulte par l'association visuelle directe</p>
    </header>

    <div class="container">
        <!-- Category Filters -->
        <div class="filter-bar" id="filter-bar">
            <button class="filter-btn active" onclick="filterCategory('All')">Tout (100)</button>
            <button class="filter-btn" onclick="filterCategory('Maison')">Maison & Mobilier</button>
            <button class="filter-btn" onclick="filterCategory('Bureau')">Bureau & Travail</button>
            <button class="filter-btn" onclick="filterCategory('Sport')">Sport & Gym</button>
            <button class="filter-btn" onclick="filterCategory('Directions')">Directions & Espace</button>
            <button class="filter-btn" onclick="filterCategory('Nombres')">Nombres & Chiffres</button>
        </div>

        <!-- Stats and Progress -->
        <div class="stats-bar" id="stats-bar">
            <span id="card-counter">Carte 1 sur 100</span>
            <span id="score-counter">Maîtrisées : 0</span>
        </div>

        <!-- Flashcard Area -->
        <div class="card-container" id="card-container" onclick="flipCard()">
            <div class="flashcard" id="flashcard">
                <!-- Front Side: Image + Action prompt -->
                <div class="card-face card-front">
                    <img id="card-img" src="" alt="Flashcard visual" class="card-image">
                    <p class="hint">Cliquez sur la carte pour révéler le mot</p>
                </div>
                <!-- Back Side: French Word + Audio -->
                <div class="card-face card-back">
                    <h2 class="french-word" id="card-word"></h2>
                    <p class="hint" id="card-category"></p>
                    <button class="btn-audio" onclick="event.stopPropagation(); playAudio()">🔊 Écouter</button>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="controls" id="action-controls">
            <button class="btn-retry" onclick="nextCard(false)">Encore besoin de pratique</button>
            <button class="btn-know" onclick="nextCard(true)">Je connais !</button>
        </div>

        <!-- Completion Screen -->
        <div class="completion-screen hidden" id="completion-screen">
            <h2>🎉 Bravo ! Session Terminée</h2>
            <p id="final-stats">Vous avez examiné toutes les cartes.</p>
            <button class="btn-know" style="margin-top: 1rem;" onclick="restartDeck()">Recommencer</button>
        </div>
    </div>

            // Nombres & Chiffres (86-100)

            { word: "La moitié", category: "Nombres", image: "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?w=400&auto=format&fit=crop&q=80" },
            { word: "Le double", category: "Nombres", image: "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?w=400&auto=format&fit=crop&q=80" }
        ];

        let activeDeck = [...masterDeck];
        let currentIndex = 0;
        let masteredCount = 0;
        let isFlipped = false;

        const flashcardEl = document.getElementById('flashcard');
        const cardImgEl = document.getElementById('card-img');
        const cardWordEl = document.getElementById('card-word');
        const cardCategoryEl = document.getElementById('card-category');
        const cardCounterEl = document.getElementById('card-counter');
        const scoreCounterEl = document.getElementById('score-counter');
        const cardContainer = document.getElementById('card-container');
        const actionControls = document.getElementById('action-controls');
        const statsBar = document.getElementById('stats-bar');
        const completionScreen = document.getElementById('completion-screen');
        const finalStats = document.getElementById('final-stats');

        function filterCategory(category) {
            // Update active button state
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'All') {
                activeDeck = [...masterDeck];
            } else {
                activeDeck = masterDeck.filter(card => card.category === category);
            }

            currentIndex = 0;
            masteredCount = 0;
            cardContainer.classList.remove('hidden');
            actionControls.classList.remove('hidden');
            statsBar.classList.remove('hidden');
            completionScreen.classList.add('hidden');
            loadCard();
        }

        function loadCard() {
            if (activeDeck.length === 0) return;
            const currentCard = activeDeck[currentIndex];
            cardImgEl.src = currentCard.image;
            cardWordEl.textContent = currentCard.word;
            cardCategoryEl.textContent = currentCard.category;
            cardCounterEl.textContent = `Carte ${currentIndex + 1} sur ${activeDeck.length}`;
            scoreCounterEl.textContent = `Maîtrisées : ${masteredCount}`;
            
            isFlipped = false;
            flashcardEl.classList.remove('flipped');
        }

        function flipCard() {
            isFlipped = !isFlipped;
            if (isFlipped) {
                flashcardEl.classList.add('flipped');
                playAudio();
            } else {
                flashcardEl.classList.remove('flipped');
            }
        }

        function playAudio() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(activeDeck[currentIndex].word);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function nextCard(known) {
            if (known) {
                masteredCount++;
            }
            
            currentIndex++;
            if (currentIndex < activeDeck.length) {
                loadCard();
            } else {
                showCompletion();
            }
        }

        function showCompletion() {
            cardContainer.classList.add('hidden');
            actionControls.classList.add('hidden');
            statsBar.classList.add('hidden');
            completionScreen.classList.remove('hidden');
            finalStats.textContent = `Vous avez maîtrisé ${masteredCount} sur ${activeDeck.length} mots dans cette catégorie !`;
        }

        function restartDeck() {
            currentIndex = 0;
            masteredCount = 0;
            cardContainer.classList.remove('hidden');
            actionControls.classList.remove('hidden');
            statsBar.classList.remove('hidden');
            completionScreen.classList.add('hidden');
            loadCard();
        }

        window.onload = loadCard;
    </script>
</body>
